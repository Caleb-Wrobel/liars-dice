# Builds the game server's container image on every push and proves it works. On main, where the repository says to,
# it also publishes the image for amd64 and arm64. Publishing is off unless the repository variable PUBLISH_IMAGES is
# "true", which is set only on the repository that publishes: a copy of the code builds and tests the image but never
# ships it, and no account name is written here.
name: Server image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push makes an older build on the same branch pointless, but a publish on main is let finish.
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # The smoke script is plain Node and needs no install; the playtest further down does.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for this machine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ts/server/Containerfile
          load: true
          tags: liars-dice-server:smoke
          provenance: false

      # Nothing is published unless this passes: the server comes up under a read-only filesystem with no capabilities,
      # makes a room, stops cleanly, and refuses a setting it cannot use.
      - name: Smoke test the image
        run: ts/server/scripts/smoke-container.sh liars-dice-server:smoke

      # Starting is not behaving. A few whole games are played against the image by simulated players, who drop, come
      # back and leave, and each check that it was shown only its own view. The playtest is bundled here, so this
      # installs the workspace; the smoke test above needs none of that.
      - name: Install the workspace
        run: npm ci
        working-directory: ts

      - name: Build the playtest
        run: npm run build:playtest -w @liars-dice/server
        working-directory: ts

      - name: Play a few games against the image
        timeout-minutes: 10
        run: ts/server/scripts/playtest-container.sh liars-dice-server:smoke 8789

      # The arm64 image is the same file on a different base, so it is tried once, under emulation, just before it is
      # published rather than on every push.
      - name: Set up emulation for arm64
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build the arm64 image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ts/server/Containerfile
          platforms: linux/arm64
          load: true
          tags: liars-dice-server:smoke-arm64
          provenance: false

      - name: Smoke test the arm64 image
        if: env.PUBLISH == 'true'
        run: ts/server/scripts/smoke-container.sh liars-dice-server:smoke-arm64 linux/arm64 8788

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is named after this repository, in lower case as the registry requires.
      - name: Name the image
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish for amd64 and arm64
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ts/server/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
