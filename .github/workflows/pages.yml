# Publishes the web game to GitHub Pages from main. The forge is the source of truth and mirrors main here, so a
# merge on the forge is what publishes a new version. Nothing is collected: the game runs entirely in the browser.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancel it half way, but keep only the latest one waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - run: npm ci

      # A broken game must never be published, so the checks run before the build is uploaded.
      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Relative asset links (--base=./) make the same build work wherever the site is served: at /<repo-name>/ on the
      # default github.io address and at the root of a custom domain, so changing the address never needs a rebuild
      # with a different base. The flag must be passed to the web workspace directly: through the root build script it
      # is silently dropped and the page comes out blank.
      # Where the game server is, if there is one. It is set as the repository variable GAME_SERVER_URL on the repository
      # that serves the public site, so the address is a setting and not a file. Unset, as on a copy with no server, the
      # build offers only play on this device. The address is public by nature: it ends up in the page.
      - name: Build the web app
        env:
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
        run: npm run build -w @liars-dice/web -- --base=./

      # Fail here, not on the live site, if the links came out absolute and so would break at one of those addresses.
      - name: Check the asset links are relative
        run: |
          grep -q 'src="./assets/' web/dist/index.html
          grep -q 'href="./assets/' web/dist/index.html
          if grep -q 'src="/' web/dist/index.html; then echo 'an absolute link slipped in'; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ts/web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
