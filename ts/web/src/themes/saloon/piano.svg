        <rect x="7" y="0" width="6" height="13"/><rect x="17" y="0" width="6" height="13"/>
        <rect x="37" y="0" width="6" height="13"/><rect x="47" y="0" width="6" height="13"/><rect x="57" y="0" width="6" height="13"/>
