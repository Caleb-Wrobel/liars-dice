  <rect x="70" y="82" width="110" height="36" fill="#e9d8a8"/>
  <g fill="#3a2516">
    <rect x="78" y="88" width="9" height="3"/><rect x="96" y="96" width="14" height="3"/><rect x="118" y="90" width="6" height="3"/>
