<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
<defs>
<radialGradient id="lantern"><stop offset="0" stop-color="#8fe39a" stop-opacity=".6"/><stop offset="1" stop-color="#8fe39a" stop-opacity="0"/></radialGradient>
<radialGradient id="eyeglow"><stop offset="0" stop-color="#ffd75a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd75a" stop-opacity="0"/></radialGradient>
<style>
.gl{animation:glow 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:flame 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fire{animation:fire 3.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vap{animation:drift 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes glow{0%,100%{opacity:1;transform:scale(1)}18%{opacity:.78;transform:scale(.96)}34%{opacity:.95;transform:scale(1.03)}52%{opacity:.7;transform:scale(.94)}71%{opacity:1;transform:scale(1.04)}86%{opacity:.85;transform:scale(.98)}}
@keyframes flame{0%,100%{transform:scale(1,1) skewX(0deg)}15%{transform:scale(.96,.92) skewX(-3deg)}33%{transform:scale(1.03,1.06) skewX(2deg)}49%{transform:scale(.94,.9) skewX(-2deg)}68%{transform:scale(1.02,1.04) skewX(3deg)}84%{transform:scale(.98,.95) skewX(-1deg)}}
@keyframes fire{0%,100%{opacity:1;transform:scale(1)}22%{opacity:.82;transform:scale(.97)}45%{opacity:.95;transform:scale(1.03)}63%{opacity:.78;transform:scale(.96)}82%{opacity:1;transform:scale(1.02)}}
@keyframes drift{0%,100%{transform:translateX(0) skewX(0deg)}50%{transform:translateX(3px) skewX(-2deg)}}
@media (prefers-reduced-motion:reduce){.gl,.fl,.fire,.vap{animation:none}}
</style>
</defs>
