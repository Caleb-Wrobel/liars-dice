  <circle cx="70" cy="205" r="3" fill="#4a3424" stroke="#1c120c" stroke-width="1"/>
  <circle cx="118" cy="204" r="3.5" fill="#4a3424" stroke="#1c120c" stroke-width="1"/>
  <circle cx="132" cy="208" r="4" fill="#4a3424" stroke="#1c120c" stroke-width="1"/>
