  <path d="M154 209V194H166V209Z" fill="#8fe39a" fill-opacity=".45" stroke="#2a2630" stroke-width="2"/>
  <path class="fl" style="animation-duration:2.9s;animation-delay:-0.7s" d="M160 206C164 202 163 198 160 194C157 198 156 202 160 206Z" fill="#b8f5be"/>
