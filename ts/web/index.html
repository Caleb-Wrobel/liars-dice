<!doctype html>
<html lang="en" data-theme="saloon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liar's Dice</title>
    <script>
      // Apply the saved skin before first paint. The key matches THEME_STORAGE_KEY in src/theme.ts.
      try {
        var saved = localStorage.getItem("liars-dice:theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
