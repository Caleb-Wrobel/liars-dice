<!doctype html>
<html lang="en" data-theme="saloon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liar's Dice</title>
    <script>
      // Apply the saved skin before first paint, or this month's seasonal table, or Saloon. The key matches
      // THEME_STORAGE_KEY and the seasons match SEASONS in src/theme.ts, which a test checks.
      var seasons = { "10": "spooky" };
      var theme = seasons[new Date().getMonth() + 1] || "saloon";
      try {
        theme = localStorage.getItem("liars-dice:theme") || theme;
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
      // "Still scenery": stop the flicker before it can start. The key matches MOTION_STORAGE_KEY in src/theme.ts.
      try {
        if (localStorage.getItem("liars-dice:still") === "1") document.documentElement.dataset.motion = "still";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
